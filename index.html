<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>@ K I O</title>

  <link rel="icon"
    type="image/png"
    href="https://file.garden/ai5wJPrOLRCONDDM/woooniche">

  <meta property="og:title" content="NICHE">
  <meta property="og:description" content="Cute lang">
  <meta property="og:image"
    content="https://file.garden/ai5wJPrOLRCONDDM/woooniche">
  <meta property="og:url" content="https://kiXo.xo.je/">
  <meta name="theme-color" content="#5865f2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07070b;
      --panel: rgba(255,255,255,0.035);
      --panel-solid: #0e0e15;
      --border: rgba(255,255,255,0.09);
      --text: #e9eaf2;
      --text-dim: #8a8c9c;
      --online: #23a55a;
      --offline: #80848e;
      --accent: #5865f2;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -25%;
      left: 50%;
      width: 70vw;
      height: 70vw;
      max-width: 820px;
      max-height: 820px;
      transform: translateX(-50%);
      background: radial-gradient(
        circle,
        rgba(88,101,242,0.08),
        transparent 65%
      );
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 880px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 20px 100px;
      opacity: 0;
      transition: opacity .5s ease;
    }

    body:not(.gate-active) .wrap {
      opacity: 1;
    }

    /* =========================
       GATE
    ========================= */

    body.gate-active {
      overflow: hidden;
    }

    #gate {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(7,7,11,.18);

      transition:
        opacity .6s ease,
        visibility .6s ease;
    }

    #gate.gate-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-bg {
      position: absolute;
      inset: -40px;
      overflow: hidden;
      background: #000;
      filter: blur(6px) grayscale(1);
      opacity: .45;
      pointer-events: none;
    }

    .gate-background-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .gate-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.45);
    }

    .gate-png-wrap {
      position: relative;
      width: 320px;
      height: 320px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gate-png-wrap::before {
      content: '';
      position: absolute;
      inset: 18px;

      background: radial-gradient(
        circle at center,
        rgba(255,255,255,.32),
        rgba(200,200,210,.18) 18%,
        rgba(20,20,25,.1) 36%,
        transparent 65%
      );

      border-radius: 18px;
      filter: blur(18px);
    }

    .gate-png {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;

      object-fit: contain;
      cursor: pointer;

      filter: drop-shadow(
        0 28px 44px rgba(255,105,180,.30)
      );

      animation: gate-float 4.6s ease-in-out infinite;

      transition: transform .35s ease;
    }

    .gate-png.clicked {
      transform: translateY(6px) scale(.96);
    }

    @keyframes gate-float {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* =========================
       NAV
    ========================= */

    nav.tabs {
      position: sticky;
      top: 16px;
      z-index: 10;

      display: flex;
      justify-content: center;

      padding-bottom: 15px;
      margin-bottom: 60px;
    }

    .tab {
      position: relative;

      background: transparent;
      border: none;

      color: #fff;

      font-family: 'Sora', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;

      padding: 6px 10px;

      cursor: default;
    }

    .tab::after {
      content: '';

      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;

      height: 2px;

      background: linear-gradient(
        90deg,
        #fff,
        #000
      );
    }

    /* =========================
       SECTION
    ========================= */

    .panel {
      position: relative;

      min-height: calc(100vh - 150px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      scroll-margin-top: 90px;

      animation: fadeUp .6s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-bg {
      position: absolute;
      top: -60px;
      bottom: -60px;
      left: 50%;
      width: 100vw;
      transform: translateX(-50%);
      overflow: hidden;
      opacity: .30;
      z-index: -1;
      pointer-events: none;
      background: #000;
    }

    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .section-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.72)),
        radial-gradient(circle at center, transparent 0%, rgba(0,0,0,.35) 100%);
    }

    .eyebrow {
      display: block;

      margin-bottom: 8px;

      color: var(--accent);

      font-size: 11.5px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: .16em;
    }

    .panel-title {
      margin-bottom: 35px;

      font-family: 'Sora', sans-serif;
      font-size: 28px;
      font-weight: 700;

      text-transform: lowercase;
    }

    /* =========================
       SINGLE PERSON
    ========================= */

    .person {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 25px;

      margin-top: 20px;
    }

    .avatar-slot {
      position: relative;

      width: 100px;
      height: 100px;

      display: flex;
      align-items: center;

      border-radius: 50%;

      background: var(--panel-solid);

      border: 1px solid var(--border);

      overflow: hidden;

      cursor: pointer;

      transition:
        width .5s cubic-bezier(.16,1,.3,1),
        height .5s cubic-bezier(.16,1,.3,1),
        border-radius .5s ease,
        gap .5s ease,
        padding .5s ease,
        box-shadow .5s ease;
    }

    .avatar-slot:hover,
    .avatar-slot.expanded {
      width: 310px;
      height: 105px;

      padding: 12px 18px;

      gap: 16px;

      border-radius: 24px;

      box-shadow:
        0 12px 30px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16);
    }

    .avatar-media {
      position: relative;

      width: 100%;
      height: 100%;

      aspect-ratio: 1 / 1;

      flex: 0 0 auto;

      border-radius: 50%;
      overflow: hidden;
    }

    .avatar-slot img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;
      border: 2px solid var(--border);

      transition:
        transform .4s ease,
        border-color .25s ease;
    }

    .avatar-slot[data-status="online"] img {
      border-color: var(--online);
    }

    .avatar-slot[data-status="idle"] img {
      border-color: #f0b232;
    }

    .avatar-slot[data-status="dnd"] img {
      border-color: #f23f42;
    }

    .avatar-slot[data-status="offline"] img {
      border-color: var(--offline);
    }

    .avatar-slot:hover img,
    .avatar-slot.expanded img {
      transform: scale(1.06);
    }

    .avatar-info {
      width: 175px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      gap: 7px;

      opacity: 0;
      transform: translateX(-8px);

      overflow: hidden;
      white-space: nowrap;

      text-align: left;

      transition:
        opacity .3s ease .1s,
        transform .3s ease .1s;
    }

    .avatar-slot:hover .avatar-info,
    .avatar-slot.expanded .avatar-info {
      opacity: 1;
      transform: translateX(0);
    }

    .info-row {
      display: flex;
      align-items: center;

      gap: 7px;

      min-width: 0;
    }

    .info-row > * {
      overflow: hidden;

      text-overflow: ellipsis;
    }

    .avatar-name {
      font-family: 'Kio', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .avatar-handle {
      color: var(--text-dim);
      font-size: 11px;
    }

    .avatar-status-text {
      display: flex;
      align-items: center;

      gap: 5px;

      color: var(--text-dim);
      font-size: 10.5px;
    }

    .avatar-activity {
      color: var(--text-dim);
      font-size: 10.5px;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-sep {
      color: var(--border);
    }

    /* =========================
       SERVER
    ========================= */

    .server-card {
      display: flex;
      align-items: center;

      gap: 14px;

      margin-top: 60px;

      padding: 14px 20px;

      width: 420px;
      max-width: 100%;

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 18px;

      text-align: left;
    }

    .server-card img {
      width: 52px;
      height: 52px;

      border-radius: 16px;

      object-fit: cover;
    }

    .server-name {
      display: block;

      margin-bottom: 5px;

      font-family: 'Sora', sans-serif;
      font-size: 16px;
      font-weight: 700;

      text-decoration: underline;
      text-underline-offset: 4px;

      cursor: pointer;
    }

    .server-stats {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 7px;

      color: var(--text-dim);

      font-size: 11.5px;
    }

    .dot {
      width: 8px;
      height: 8px;

      display: inline-block;

      border-radius: 50%;
    }

    .dot.online {
      background: var(--online);
      box-shadow: 0 0 6px var(--online);
    }

    .dot.offline {
      background: transparent;
      border: 2px solid var(--offline);
    }

    .dot.idle {
      background: #f0b232;
    }

    .dot.dnd {
      background: #f23f42;
    }

    .divider {
      color: var(--border);
    }

    /* =========================
       BADGE
    ========================= */

    .founder-badge {
      position: relative;

      padding: 9px 30px;

      font-family: 'Sora', sans-serif;
      font-size: 10.5px;
      font-weight: 700;

      letter-spacing: .14em;
      text-transform: uppercase;

      color: var(--text);

      overflow: hidden;
    }

    .badge-shine {
      position: absolute;

      top: 0;
      left: -60%;

      width: 40%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.6),
        transparent
      );

      animation: badgeShine 1.5s ease-in-out infinite;
    }

    @keyframes badgeShine {
      0% {
        left: -60%;
      }

      100% {
        left: 140%;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {
      .wrap {
        padding: 25px 15px 80px;
      }

      .gate-png-wrap {
        width: 240px;
        height: 240px;
      }

      .panel-title {
        font-size: 23px;
      }

      .avatar-slot {
        width: 82px;
        height: 82px;
      }

      .avatar-slot:hover,
      .avatar-slot.expanded {
        width: 290px;
        max-width: 90vw;
        height: 98px;
      }

      .server-card {
        width: 100%;
      }
    }
  </style>
</head>

<body class="gate-active">

  <!-- MUSIC -->
  <audio id="bg-audio" loop preload="none"></audio>

  <!-- ENTER SCREEN -->
  <div id="gate">

    <div class="gate-bg">
      <video class="gate-background-video" autoplay muted loop playsinline preload="auto">
        <source src="https://file.garden/aqy-eAuh8XwsQ3xK/TVik44lTygaZ6MQA%20(1).mp4" type="video/mp4">
      </video>
    </div>

    <div class="gate-png-wrap">
      <img
        src="https://file.garden/aqy-eAuh8XwsQ3xK/image-removebg-preview.png"
        alt="enter"
        class="gate-png"
        id="gate-png">
    </div>

  </div>


  <!-- MAIN -->
  <div class="wrap">

    <nav class="tabs">
      <button class="tab active">KIO</button>
    </nav>


    <section id="kio" class="panel">

      <div
        class="section-bg"
        style="background-image:url('https://file.garden/aqy-eAuh8XwsQ3xK/videoframe_243.png')">
      </div>


      <span class="eyebrow">Quote</span>

      <h1 class="panel-title">
        Not All Day One, Is A Real One
      </h1>


      <!-- ONLY ONE PERSON -->
      <div class="person">

        <div
          class="avatar-slot"
          id="person"
          data-user-id="1528724474164154421"
          data-status="offline">
          <div class="avatar-media">
            <img src="https://file.garden/aqy-eAuh8XwsQ3xK/dc687064ba3ce0a2268627acc2dddcd1.webp" alt="KIO">
          </div>
          <div class="avatar-info">
            <div class="info-row">
              <span class="avatar-name">KIO</span>
              <span class="info-sep">|</span>
              <span class="avatar-handle">@kio</span>
            </div>
            <div class="info-row">
              <span class="avatar-status-text">
                <span class="dot offline"></span>
                Offline
              </span>
              <span class="info-sep">|</span>
              <span class="avatar-activity">No Activity</span>
            </div>
          </div>
        </div>

          <span class="badge-shine"></span>
          KIO
        </div>

      </div>


      <!-- DISCORD SERVER -->
      <div
        class="server-card"
        data-invite-code="5yyGEgyFG">

        <img
          src="file:///C:/Users/Administrator/Downloads/image%20(1).webp"
          alt="server icon"
          id="server-icon">

        <div>

          <span
            class="Ygorot"
            id="server-name">
          </span>

          <div class="server-stats">

            <span id="server-members">
              Members: 1,845
            </span>

            <span class="divider">|</span>

            <span class="dot online"></span>

            <span id="server-online">
              238 Online
            </span>

            <span class="divider">|</span>

            <span class="dot offline"></span>

            <span id="server-offline">
              128 Offline
            </span>

          </div>

        </div>

      </div>

    </section>

  </div>


<script>

  /* =========================================
     CHANGE THIS TO THE ONE PERSON'S DISCORD ID
  ========================================= */

  const SINGLE_USER_ID = '1528724474164154421';


  /* =========================================
     MUSIC / GATE
  ========================================= */

  const MUSIC_URL =
    'https://file.garden/ai5wJPrOLRCONDDM/stayhere4life';

  const gate =
    document.getElementById('gate');

  const gatePng =
    document.getElementById('gate-png');

  const bgAudio =
    document.getElementById('bg-audio');


  gatePng.addEventListener('click', () => {

    bgAudio.src = MUSIC_URL;
    bgAudio.volume = 0.5;

    bgAudio.play().catch(() => {});

    gatePng.classList.add('clicked');

    setTimeout(() => {
      gate.classList.add('gate-hidden');
    }, 140);

    setTimeout(() => {
      document.body.classList.remove('gate-active');
    }, 740);

  }, { once: true });


  /* =========================================
     LOAD ONE DISCORD USER
  ========================================= */

  async function loadDiscordUser() {

    const slot =
      document.getElementById('person');

    try {

      const res =
        await fetch(
          `https://api.lanyard.rest/v1/users/${SINGLE_USER_ID}`
        );

      const json =
        await res.json();

      if (!json.success) {
        throw new Error('Lanyard lookup failed');
      }


      const data =
        json.data;

      const user =
        data.discord_user;


      /* Avatar */

      const hash =
        user.avatar;

      const ext =
        hash && hash.startsWith('a_')
          ? 'gif'
          : 'png';


      const avatarUrl = 'https://file.garden/aqy-eAuh8XwsQ3xK/image-removebg-preview%20(1).png';
        hash

        ? `https://cdn.discordapp.com/avatars/${SINGLE_USER_ID}/${hash}.${ext}?size=256`
        : 'https://file.garden/aqy-eAuh8XwsQ3xK/image-removebg-preview%20(1).png';


      /* Status */

      const status =
        data.discord_status || 'offline';


      const statusLabels = {
        online: 'Online',
        idle: 'Idle',
        dnd: 'Do Not Disturb',
        offline: 'Offline'
      };


      const statusLabel =
        statusLabels[status] || 'Offline';


      /* Name */

      const displayName = KIO
        user.global_name ||
        user.username;


      /* Activity */

      const activities =
        (data.activities || [])
          .filter(activity => activity.type !== 4);


      let activityText =
        'No Activity';


      if (activities.length) {

        const activity =
          activities[0];

        const activityLabels = {
          0: 'Playing',
          1: 'Streaming',
          2: 'Listening to',
          3: 'Watching',
          5: 'Competing in'
        };

        activityText =
          `${activityLabels[activity.type] || 'Playing'} ${activity.name}`;
      }


      slot.dataset.status = status;


      slot.innerHTML = `

        <div class="avatar-media">

          <img
            src="${avatarUrl}"
            alt="${displayName}">

        </div>


        <div class="avatar-info">

          <div class="info-row">

            <span class="avatar-name">
              ${displayName}
            </span>

            <span class="info-sep">|</span>

            <span class="avatar-handle">
              @${user.username}
            </span>

          </div>


          <div class="info-row">

            <span class="avatar-status-text">

              <span class="dot ${status}"></span>

              ${statusLabel}

            </span>

            <span class="info-sep">|</span>

            <span class="avatar-activity">
              ${activityText}
            </span>

          </div>

        </div>

      `;


    } catch (error) {

      console.error(error);


      slot.dataset.status = 'offline';


      slot.innerHTML = `

        <div class="avatar-media">

          <img
            src="https://file.garden/aqy-eAuh8XwsQ3xK/dc687064ba3ce0a2268627acc2dddcd1.webp"
            alt="Unknown user">

        </div>


        <div class="avatar-info">

          <div class="info-row">

            <span class="avatar-name">
              Unknown User
            </span>

          </div>


          <div class="info-row">

            <span class="avatar-status-text">

              <span class="dot offline"></span>

              Unavailable

            </span>

          </div>

        </div>

      `;

    }

  }


  loadDiscordUser();


  /* =========================================
     CLICK TO EXPAND PERSON
  ========================================= */

  const person =
    document.getElementById('person');


  person.addEventListener('click', (event) => {

    event.stopPropagation();

    person.classList.toggle('expanded');

  });


  document.addEventListener('click', () => {

    person.classList.remove('expanded');

  });


  /* =========================================
     DISCORD SERVER
  ========================================= */

  async function loadServerWidget() {

    const card =
      document.querySelector('.server-card');

    const inviteCode =
      card.dataset.inviteCode;


    try {

      const inviteRes =
        await fetch(
          `https://discord.com/api/v9/invites/${inviteCode}?with_counts=true`
        );

      const data =
        await inviteRes.json();


      if (data.guild) {

        document.getElementById('server-name')
          .textContent =
          data.guild.name;


        if (data.guild.icon) {

          document.getElementById('server-icon').src =
            `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png`;
        }

      }


      const total =
        data.approximate_member_count;

      const online =
        data.approximate_presence_count;


      if (
        total !== undefined &&
        online !== undefined
      ) {

        document.getElementById('server-members')
          .textContent =
          `Members: ${total.toLocaleString()}`;


        document.getElementById('server-online')
          .textContent =
          `${online.toLocaleString()} Online`;


        document.getElementById('server-offline')
          .textContent =
          `${Math.max(0, total - online).toLocaleString()} Offline`;

      }


    } catch (error) {

      console.error(error);

      document.getElementById('server-name')
        .textContent =
        'Unavailable';

    }

  }


  loadServerWidget();


  /* =========================================
     SERVER INVITE
  ========================================= */

  document
    .querySelector('.server-name')
    .addEventListener('click', () => {

      const code =
        document
          .querySelector('.server-card')
          .dataset.inviteCode;

      window.open(
        `https://discord.gg/${code}`,
        '_blank'
      );

    });


  /* =========================================
     TITLE ANIMATION
  ========================================= */

  const fullTitle =
    '@ K I O';

  const minTitle =
    '@';

  let i =
    minTitle.length;

  let typing =
    true;


  function tick() {

    document.title =
      fullTitle.slice(0, i);


    if (typing) {

      if (i < fullTitle.length) {

        i++;

      } else {

        typing = false;

        setTimeout(tick, 900);

        return;
      }

    } else {

      if (i > minTitle.length) {

        i--;

      } else {

        typing = true;

        setTimeout(tick, 500);

        return;
      }

    }


    setTimeout(tick, 180);

  }


  tick();

</script>

</body>
</html>
